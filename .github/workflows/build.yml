name: Compilar APK

on:
  push:
    branches: [main]
    paths-ignore:
      - 'releases/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Preparar la firma (si hay llave en los secretos)
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KS_B64" ]; then
            mkdir -p keystore
            echo "$KS_B64" | base64 -d > keystore/visorgopro.jks
            printf 'storeFile=keystore/visorgopro.jks\nstorePassword=%s\nkeyAlias=visorgopro\nkeyPassword=%s\n' "$KS_PASS" "$KS_PASS" > signing.properties
            echo "Firmando con la llave guardada en los secretos."
          else
            echo "Sin llave en los secretos: se firma con la llave de debug (temporal)."
          fi

      - name: Compilar APK
        run: |
          chmod +x ./gradlew
          set -o pipefail
          ./gradlew assembleRelease --no-daemon 2>&1 | tee build.log

      - name: Guardar el error de compilación en el repositorio
        if: failure()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p releases
          { grep -nE "^e: |error:|FAILED|What went wrong" -A4 build.log | head -200; } > releases/build-error.log || true
          git add releases/build-error.log
          git commit -m "Registro del error de compilación" || true
          git push || true

      - name: Nombrar el APK con la versión
        run: |
          VERSION=$(grep 'val appVersionName' app/build.gradle.kts | sed 's/.*"\(.*\)".*/\1/')
          mkdir -p dist
          cp "$(find app/build/outputs/apk/release -name '*.apk' | head -n 1)" "dist/VisorGoPro-${VERSION}.apk"
          ls -la dist

      - name: Registrar la huella de la firma (dato público, no es secreto)
        run: |
          VERSION=$(grep 'val appVersionName' app/build.gradle.kts | sed 's/.*"\(.*\)".*/\1/')
          if [ -f signing.properties ]; then ORIGEN="llave propia (secretos de GitHub)"; else ORIGEN="llave de debug temporal"; fi
          APKSIGNER=$(ls -d "${ANDROID_HOME:-/usr/local/lib/android/sdk}"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -n 1 || true)
          {
            echo "Versión: ${VERSION}"
            echo "Firmado con: ${ORIGEN}"
            if [ -n "$APKSIGNER" ]; then
              "$APKSIGNER" verify --print-certs "dist/VisorGoPro-${VERSION}.apk" 2>&1 | grep -i "SHA-256" || true
            fi
          } | tee dist/firma.txt

      - uses: actions/upload-artifact@v4
        with:
          name: VisorGoPro-apk
          path: dist/*.apk

      - name: Guardar el último APK en el repositorio (carpeta releases)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p releases
          rm -f releases/*.apk releases/build-error.log
          cp dist/*.apk dist/firma.txt releases/
          git add releases
          git commit -m "APK $(basename dist/*.apk)" || echo "Sin cambios"
          git push
